<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#1f293d" stroke-width="12"/>

  <!-- Glowing Cyber Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primary)" stroke-width="8" opacity="0.4" stroke-dasharray="16 8"/>

  <!-- Gamepad / Bot Core Icon -->
  <g filter="url(#glow)">
    <path d="M160 210 C160 170, 352 170, 352 210 C364 240, 384 320, 350 344 C324 362, 290 326, 276 304 C266 292, 246 292, 236 304 C222 326, 188 362, 162 344 C128 320, 148 240, 160 210 Z"
          fill="url(#primary)" stroke="#ffffff" stroke-width="6"/>
    <!-- D-pad -->
    <path d="M190 230 L210 230 M200 220 L200 240" stroke="#0a0d14" stroke-width="8" stroke-linecap="round"/>
    <!-- Action Buttons -->
    <circle cx="312" cy="226" r="6" fill="#10b981"/>
    <circle cx="328" cy="242" r="6" fill="#38bdf8"/>
    <circle cx="296" cy="242" r="6" fill="#8b5cf6"/>
    <circle cx="312" cy="258" r="6" fill="#f59e0b"/>
  </g>

  <!-- Cyber Neon Status Indicator -->
  <circle cx="380" cy="132" r="22" fill="#10b981" filter="url(#glow)"/>
  <circle cx="380" cy="132" r="14" fill="#ffffff"/>
</svg>
